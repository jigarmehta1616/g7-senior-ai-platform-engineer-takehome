name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src mcp tests scripts
      - name: Type-check
        run: mypy
      - name: Unit, integration, contract tests and MCP evals
        run: pytest -q
      - name: Postman regression suite against the running stack
        run: |
          python scripts/run_local.py &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 0.5; done
          npx --yes newman@6 run postman/support-platform.postman_collection.json -e postman/local.postman_environment.json

  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Lint (zero warnings), typecheck and build
        run: npm run check

  image:
    runs-on: ubuntu-latest
    needs: [test, console]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t support-platform:ci .
