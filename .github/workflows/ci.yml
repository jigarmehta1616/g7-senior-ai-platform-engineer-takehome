name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src mcp tests scripts
      - name: Type-check
        run: mypy
      - name: Unit, integration, contract tests and MCP evals
        run: pytest -q
      # The Postman run needs the full app, including the built console.
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build the console
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Start the app
        run: |
          python scripts/run_local.py > app.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/readyz > /dev/null; then echo "app is ready"; exit 0; fi
            sleep 0.5
          done
          echo "The app did not become ready within 60 seconds. Server log:"
          cat app.log
          exit 1
      - name: Postman regression suite
        run: npx --yes newman@6 run postman/support-platform.postman_collection.json -e postman/local.postman_environment.json
      - name: Show the server log if anything failed
        if: failure()
        run: cat app.log || true

  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Lint (zero warnings), typecheck and build
        run: npm run check

  image:
    runs-on: ubuntu-latest
    needs: [test, console]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t support-platform:ci .
